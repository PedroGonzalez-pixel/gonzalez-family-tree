<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gonzalez Family Tree - Connexion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 48px;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        
        .logo {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #1d1d1f;
        }
        
        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        
        button {
            width: 100%;
            padding: 14px 24px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #0061d5;
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .error {
            background: #fee;
            color: #c33;
            display: none;
        }
        
        .success {
            background: #efe;
            color: #3c3;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🌳</div>
        <h1>Arbre Généalogique Gonzalez</h1>
        <p>Connectez-vous pour voir l'arbre généalogique de la famille</p>
        
        <button id="loginBtn">Se connecter avec Google</button>
        
        <div id="errorMsg" class="message error"></div>
        <div id="successMsg" class="message success"></div>
    </div>

    <!-- ========== FIREBASE SCRIPTS ========== -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore.js"></script>

    <!-- ========== CONFIG ========== -->
    <script src="config.js"></script>

    <!-- ========== GOOGLE SIGN IN ========== -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- ========== AUTH ========== -->
    <script src="js/auth.js"></script>

    <!-- ========== PAGE SCRIPT ========== -->
    <script>
        console.log("✅ index.html loaded");
        console.log("Firebase available:", typeof firebase !== 'undefined');
        console.log("Config loaded:", typeof db !== 'undefined');
        
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        
        // Check if already logged in
        firebase.auth().onAuthStateChanged(function(user) {
            if (user) {
                console.log("✅ User already logged in:", user.email);
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 500);
            }
        });
        
        // Login button click
        loginBtn.addEventListener('click', function() {
            console.log("🔵 Login button clicked");
            
            if (typeof signInWithGoogle !== 'function') {
                showError("Erreur: Fonction signInWithGoogle non disponible");
                return;
            }
            
            loginBtn.disabled = true;
            loginBtn.textContent = 'Connexion en cours...';
            
            signInWithGoogle()
                .then(() => {
                    console.log("✅ Sign in successful");
                    showSuccess("Connexion réussie!");
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                })
                .catch((error) => {
                    console.error("❌ Sign in error:", error);
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Se connecter avec Google';
                    showError('Erreur: ' + error.message);
                });
        });
        
        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
            successMsg.style.display = 'none';
        }
        
        function showSuccess(msg) {
            successMsg.textContent = msg;
            successMsg.style.display = 'block';
            errorMsg.style.display = 'none';
        }
    </script>
</body>
</html>

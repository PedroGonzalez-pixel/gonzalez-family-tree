<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gonzalez Family Tree - Connexion</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 48px 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 24px;
        }
        
        h1 {
            font-size: 28px;
            margin: 0 0 12px 0;
            color: #1d1d1f;
            font-weight: 600;
        }
        
        .subtitle {
            font-size: 16px;
            color: #666;
            margin: 0 0 40px 0;
            line-height: 1.5;
        }
        
        #googleSignInBtn {
            width: 100%;
            padding: 14px 24px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        #googleSignInBtn:hover {
            background: #0061d5;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 113, 227, 0.3);
        }
        
        #googleSignInBtn:active {
            transform: translateY(0);
        }
        
        #googleSignInBtn.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-message {
            color: #d70015;
            font-size: 14px;
            margin-top: 16px;
            padding: 12px;
            background: rgba(215, 0, 21, 0.1);
            border-radius: 8px;
            display: none;
        }
        
        .success-message {
            color: #34c759;
            font-size: 14px;
            margin-top: 16px;
            padding: 12px;
            background: rgba(52, 199, 89, 0.1);
            border-radius: 8px;
            display: none;
        }
        
        .footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e5e5e7;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🌳</div>
        <h1>Arbre Généalogique Gonzalez</h1>
        <p class="subtitle">Connectez-vous pour voir l'arbre généalogique de la famille</p>
        
        <button id="googleSignInBtn">
            <span class="loading-spinner"></span>
            Se connecter avec Google
        </button>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        
        <div class="footer">
            <p>Seules les personnes autorisées peuvent accéder à l'arbre</p>
        </div>
    </div>

    <!-- ========== FIREBASE SCRIPTS (IMPORTANT: AVANT config.js) ========== -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore.js"></script>

    <!-- ========== CONFIG (APRÈS Firebase) ========== -->
    <script src="config.js"></script>

    <!-- ========== AUTH (APRÈS config.js) ========== -->
    <script src="js/auth.js"></script>

    <!-- ========== GOOGLE SIGN-IN SCRIPT ========== -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- ========== PAGE LOGIC ========== -->
    <script>
        // Quand la page charge
        document.addEventListener('DOMContentLoaded', function() {
            console.log("✅ index.html loaded");
            console.log("Firebase Auth:", typeof firebase !== 'undefined' ? firebase.auth() : 'NOT LOADED');
            
            // Vérifier si déjà connecté
            firebase.auth().onAuthStateChanged(function(user) {
                if (user) {
                    // Utilisateur déjà connecté → aller à dashboard
                    console.log("✅ User already logged in:", user.email);
                    window.location.href = 'dashboard.html';
                } else {
                    // Pas connecté, afficher le bouton login
                    console.log("⏳ User not logged in, showing login button");
                }
            });
        });

        // Gestion du bouton "Se connecter avec Google"
        const googleSignInBtn = document.getElementById('googleSignInBtn');
        
        if (googleSignInBtn) {
            googleSignInBtn.addEventListener('click', function() {
                console.log("🔵 Google Sign In button clicked");
                
                // Vérifier que signInWithGoogle existe
                if (typeof signInWithGoogle !== 'function') {
                    console.error("❌ signInWithGoogle function not found");
                    showError("Erreur : Fonction de connexion non trouvée");
                    return;
                }
                
                // Désactiver le bouton pendant la connexion
                googleSignInBtn.disabled = true;
                googleSignInBtn.classList.add('loading');
                document.querySelector('.loading-spinner').style.display = 'inline-block';
                
                // Appeler la fonction de connexion
                signInWithGoogle()
                    .then(() => {
                        console.log("✅ Sign in successful");
                        showSuccess("Connexion réussie, redirection...");
                        // La redirection se fait dans auth.js
                    })
                    .catch((error) => {
                        console.error("❌ Sign in error:", error);
                        googleSignInBtn.disabled = false;
                        googleSignInBtn.classList.remove('loading');
                        document.querySelector('.loading-spinner').style.display = 'none';
                        showError(`Erreur de connexion: ${error.message}`);
                    });
            });
        } else {
            console.error("❌ Google Sign In button not found in HTML");
        }

        // Fonctions d'affichage des messages
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            console.error("🔴", message);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            console.log("🟢", message);
        }
    </script>
</body>
</html>
